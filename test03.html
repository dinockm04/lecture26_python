<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>test03</title>
</head>
<body>
<script>
document.write("<h3>&lt;1 - 50 숫자중 십의 자리 짝수면서 일의 자리 홀수고, 3의 배수인 숫자 출력&gt;</h3>");

let count = 0;

for(let i = 10; i <= 50; i++){
    let ten = parseInt(i / 10);
    let one = i % 10;
    
    if(ten % 2 == 0 && one % 2 == 1 && i % 3 == 0){
        document.write(i + "&nbsp;&nbsp;");
        count++;
    }
}

document.write("<br><br>총 개수 : " + count + "개");
</script>
</body>
</html>
