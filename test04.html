<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>test04</title>
</head>
<body>
<script>
document.write("<h3>&lt;100~200 숫자 중 자리가 4이고, 6의 배수 출력&gt;</h3>");

let count = 0;

for(let i = 100; i <= 200; i++){
    if(String(i).includes("4") && i % 6 == 0){
        document.write(i + "&nbsp;&nbsp;");
        count++;
    }
}

document.write("<br><br>총 개수 : " + count + "개");
</script>
</body>
</html>
