<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>test01</title>
</head>
<body>
<script>
let num = Number(prompt("정수를 입력하세요"));

document.write("<h3>&lt;1 ~ " + num + " 사이의 정수값을 한라인에 5개씩 출력하기&gt;</h3>");

for(let i = 1; i <= num; i++){
    document.write(i + "&nbsp;&nbsp;");
    
    if(i % 5 == 0){
        document.write("<br>");
    }
}

document.write("<br><br>");
document.write("<h3>&lt;" + num + "의 약수 출력&gt;</h3>");

let count = 0;

for(let i = 1; i <= num; i++){
    if(num % i == 0){
        document.write(i + "&nbsp;&nbsp;");
        count++;
    }
}

document.write("<br><br>약수의 총개수 : " + count + "개");
</script>
</body>
</html>
